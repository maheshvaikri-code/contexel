[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contexel"
version = "0.1.17"
description = "Deterministic, dependency-free context-economy stages for code-writing agents."
readme = "README_PYPI.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mahesh Vaikri" }]
keywords = ["llm", "agents", "context-engineering", "tokens", "tool-use", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
accurate = ["tiktoken>=0.5"]
dev = ["pytest>=7"]
# Lint and type gate (CI job "hygiene"; dev-only, never shipped). mypy 2.x
# cannot target Python 3.9, so install this extra on Python 3.10 or newer.
lint = ["ruff>=0.15,<1", "mypy>=2.3,<3"]
benchmarks = [
    "tiktoken>=0.5",
    "requests",
    "pyarrow>=14.0.1",
    "toolz",
    "langchain-core",
    "llama-index-core",
    "packaging",
]

[project.urls]
Homepage = "https://github.com/maheshvaikri-code/contexel"
Repository = "https://github.com/maheshvaikri-code/contexel"
Documentation = "https://maheshvaikri-code.github.io/contexel/"
Changelog = "https://github.com/maheshvaikri-code/contexel/blob/main/CHANGELOG.md"
Issues = "https://github.com/maheshvaikri-code/contexel/issues"

[tool.hatch.build.targets.wheel]
packages = ["contexel"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.mypy]
files = ["contexel"]
# mypy 2.x refuses a 3.9 target. The 3.9 CI legs run the tests on a real 3.9;
# mypy checks the types against 3.10, the oldest version it supports.
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true

# tiktoken is an optional runtime dependency and the CI hygiene job installs
# only the lint extra, so mypy must not require it to be present.
[[tool.mypy.overrides]]
module = "tiktoken"
ignore_missing_imports = true
