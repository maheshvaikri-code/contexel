[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contexel"
version = "0.1.14"
description = "Deterministic, dependency-free context-economy stages for code-writing agents."
readme = "README_PYPI.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mahesh Vaikri" }]
keywords = ["llm", "agents", "context-engineering", "tokens", "tool-use", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
accurate = ["tiktoken>=0.5"]
dev = ["pytest>=7"]
benchmarks = [
    "tiktoken>=0.5",
    "requests",
    "pyarrow",
    "toolz",
    "langchain-core",
    "llama-index-core",
    "packaging",
]

[project.urls]
Homepage = "https://github.com/maheshvaikri-code/contexel"
Repository = "https://github.com/maheshvaikri-code/contexel"
Documentation = "https://maheshvaikri-code.github.io/contexel/"
Changelog = "https://github.com/maheshvaikri-code/contexel/blob/main/CHANGELOG.md"
Issues = "https://github.com/maheshvaikri-code/contexel/issues"

[tool.hatch.build.targets.wheel]
packages = ["contexel"]
