[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contexel"
version = "0.1.8"
description = "Deterministic, dependency-free context-economy stages for code-writing agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mahesh Vaikri" }]
keywords = ["llm", "agents", "context-engineering", "tokens", "tool-use", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
accurate = ["tiktoken>=0.5"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/maheshvaikri-code/contexel"
Repository = "https://github.com/maheshvaikri-code/contexel"

[tool.hatch.build.targets.wheel]
packages = ["contexel"]
