# Registry releases (PyPI + npm) — run only when a human creates a version
# tag (v*) or clicks Run workflow. The pipeline executes the release; it
# never decides it (.Doctrine/skills/cicd.md). One tag ships ALL THREE
# packages: the version guards below require pyproject.toml, ts/package.json,
# AND csharp/Contexel/Contexel.csproj to equal the tag, so the registries
# can never drift. NuGet publish uses TRUSTED PUBLISHING too: NuGet/login
# exchanges the job's OIDC token for a short-lived API key (policy on
# nuget.org: owner maheshvaikri, repo contexel, workflow release.yml).
#
# All three artifacts are platform-independent (pure Python wheel, pure-TS
# tarball, pure-C# assembly) — "all OS" is enforced by GATES, not per-OS
# builds: the full suites must pass on Linux + Windows + macOS before any
# publish, and the post-publish smokes install the published artifacts on
# all three.
#
# PyPI publishing uses TRUSTED PUBLISHING (OIDC) with provenance
# attestations — no long-lived token (publisher configured on PyPI).
# npm publishing authenticates with the NPM_TOKEN repo secret and adds
# npm provenance attestations (--provenance, OIDC id-token).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install (with test tooling)
        run: python -m pip install -e ".[dev,accurate]"
      - name: Full suite on this exact commit (no inherited green)
        run: python -m pytest -q

  ts-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The published artifact must match the Python canon: regenerate the
      # golden vectors from this exact commit and fail on any drift before
      # the TS suite even runs (same guarantee as CI's ts-parity job).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python parity/generate_vectors.py
      - run: git diff --exit-code parity/vectors.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Full TS suite on this exact commit
        working-directory: ts
        run: |
          npm ci
          npm run build
          npm test

  cs-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python parity/generate_vectors.py
      - run: git diff --exit-code parity/vectors.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Full C# suite on this exact commit
        run: dotnet test csharp/Contexel.Tests/Contexel.Tests.csproj --nologo

  pypi-publish:
    needs: [test, ts-test, cs-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC for Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Version must match the tag
        if: github.ref_type == 'tag'
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $V"
            exit 1
          fi
      - name: Build sdist + wheel
        run: python -m build
      - name: Metadata check
        run: python -m twine check dist/*
      - name: Publish to PyPI (Trusted Publishing + attestations)
        # only a tag PUSH publishes; workflow_dispatch (even on a tag ref)
        # is always a dry-run
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          attestations: true

  npm-publish:
    # PyPI is the canon registry: if the Python release fails, its npm
    # mirror must not ship (cross-registry drift beats atomicity we can't
    # have). On dispatch dry-runs this still exercises the whole job.
    needs: [pypi-publish, ts-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write  # OIDC for npm provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Version must match the tag
        if: github.ref_type == 'tag'
        working-directory: ts
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match ts/package.json version $V"
            exit 1
          fi
      - name: Build and pack (prepublishOnly re-runs build + tests)
        working-directory: ts
        run: |
          npm ci
          npm run build
          npm pack --dry-run
      - name: Publish to npm (token auth + provenance)
        # only a tag PUSH publishes; workflow_dispatch (even on a tag ref)
        # is always a dry-run
        if: github.event_name == 'push' && github.ref_type == 'tag'
        working-directory: ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  nuget-publish:
    # PyPI is the canon registry (same sequencing rationale as npm-publish).
    # NuGet TRUSTED PUBLISHING: the policy on nuget.org (owner maheshvaikri,
    # repo maheshvaikri-code/contexel, workflow release.yml) lets NuGet/login
    # exchange this job's OIDC token for a short-lived API key — no
    # long-lived secret.
    needs: [pypi-publish, cs-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write  # OIDC for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Version must match the tag
        if: github.ref_type == 'tag'
        run: |
          V=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' csharp/Contexel/Contexel.csproj)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Contexel.csproj version $V"
            exit 1
          fi
      - name: Test, pack
        run: |
          dotnet test csharp/Contexel.Tests/Contexel.Tests.csproj --nologo
          dotnet pack csharp/Contexel/Contexel.csproj --nologo -c Release -o packed
      - name: NuGet login (Trusted Publishing OIDC -> temp API key)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: maheshvaikri
      - name: Publish to NuGet
        # only a tag PUSH publishes; workflow_dispatch is always a dry-run
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          dotnet nuget push packed/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  nuget-smoke:
    needs: nuget-publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Install the PUBLISHED package in a clean project
        run: |
          V=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' csharp/Contexel/Contexel.csproj)
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          dotnet new console -n Quickstart >/dev/null
          cd Quickstart
          ok=0
          for i in $(seq 1 10); do
            dotnet add package Contexel --version "$V" && ok=1 && break
            echo "index not ready yet (attempt $i), retrying in 30s"; sleep 30
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Contexel $V never became installable from nuget.org"
            exit 1
          fi
      - name: Run the quickstart against the published package
        run: |
          cd "$RUNNER_TEMP/smoke/Quickstart"
          cat > Program.cs <<'CS'
          using Contexel;
          using Rec = System.Collections.Generic.Dictionary<string, object?>;
          using Records = System.Collections.Generic.List<System.Collections.Generic.Dictionary<string, object?>>;

          var raw = new Records();
          for (int i = 0; i < 12; i++)
              raw.Add(new Rec
              {
                  ["title"] = $"doc {i}", ["url"] = $"https://kb/{i % 4}",
                  ["snippet"] = string.Concat(Enumerable.Repeat("retry with exponential backoff ", 10)),
                  ["score"] = (long)(i % 7),
              });

          using var t = Trace.Begin(idField: "url");
          var r = Stages.Select(raw, new[] { "title", "url", "snippet", "score" });
          r = Stages.Dedupe(r, "url");
          r = Stages.Rescore(r, "exponential backoff", new[] { "title", "snippet" });
          r = Stages.Rank(r, "score", desc: true);
          r = Stages.TrimToBudget(r, 400, minRecords: 1);
          if (r.Count == 0 || r.Count > 4) throw new Exception($"unexpected: {r.Count}");
          Console.WriteLine(t.Report());
          Console.WriteLine($"quickstart OK: {r.Count} records");
          CS
          dotnet run

  pypi-smoke:
    needs: pypi-publish
    # runs only when the publish step actually ran (tag push, not dispatch)
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install the PUBLISHED artifact in a clean environment
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          for i in $(seq 1 10); do
            python -m pip install "contexel==$V" && break
            echo "index not ready yet (attempt $i), retrying in 30s"; sleep 30
          done
          python -c "import contexel; print('installed', contexel.__version__)"
      - name: Run the quickstart against the published package
        run: |
          cd "$RUNNER_TEMP"   # away from the repo, so the wheel is what's imported
          python - <<'PY'
          from contexel import select, dedupe, rescore, rank, trim_to_budget, trace
          raw = [
              {"title": f"doc {i}", "url": f"https://kb/{i % 4}",
               "snippet": "retry with exponential backoff " * 10, "score": i % 7}
              for i in range(12)
          ]
          with trace() as t:
              r = select(raw, ["title", "url", "snippet", "score"])
              r = dedupe(r, key="url")
              r = rescore(r, query="exponential backoff", fields=("title", "snippet"))
              r = rank(r, by="score", desc=True)
              r = trim_to_budget(r, max_tokens=400, min_records=1)
          assert r and len(r) <= 4, r
          print(t.report())
          print("quickstart OK:", len(r), "records")
          PY

  npm-smoke:
    needs: npm-publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install the PUBLISHED artifact in a clean environment
        run: |
          V=$(node -p "require('./ts/package.json').version")
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          for i in $(seq 1 10); do
            npm install "contexel@$V" && break
            echo "registry not ready yet (attempt $i), retrying in 30s"; sleep 30
          done
          node -p "require('contexel/package.json').version"
      - name: Run the quickstart against the published package
        run: |
          cd "$RUNNER_TEMP/smoke"
          cat > quickstart.mjs <<'JS'
          import { select, dedupe, rescore, rank, trimToBudget, trace } from "contexel";
          const raw = Array.from({ length: 12 }, (_, i) => ({
            title: `doc ${i}`, url: `https://kb/${i % 4}`,
            snippet: "retry with exponential backoff ".repeat(10), score: i % 7,
          }));
          const [r, t] = trace({ idField: "url" }, () => {
            let x = select(raw, { fields: ["title", "url", "snippet", "score"] });
            x = dedupe(x, { key: "url" });
            x = rescore(x, { query: "exponential backoff", fields: ["title", "snippet"] });
            x = rank(x, { by: "score", desc: true });
            return trimToBudget(x, { maxTokens: 400, minRecords: 1 });
          });
          if (!r.length || r.length > 4) throw new Error(`unexpected: ${r.length}`);
          console.log(t.report());
          console.log("quickstart OK:", r.length, "records");
          JS
          node quickstart.mjs
