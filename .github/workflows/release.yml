# PyPI release — runs only when a human creates a version tag (v*) or
# clicks Run workflow. The pipeline executes the release; it never decides
# it (.Doctrine/skills/cicd.md).
#
# Publishing uses PyPI TRUSTED PUBLISHING (OIDC) with provenance
# attestations — no long-lived token. ONE-TIME SETUP required before the
# next tag: PyPI -> Your projects -> contexel -> Manage -> Publishing ->
# add a new GitHub publisher (owner: maheshvaikri-code, repo: contexel,
# workflow: release.yml, environment: pypi). The old PYPI_TOKEN secret can
# then be deleted from GitHub.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC for Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install (with test + build tooling)
        run: |
          python -m pip install -e ".[dev,accurate]"
          python -m pip install build twine
      - name: Full suite on this exact commit (no inherited green)
        run: python -m pytest -q
      - name: Version must match the tag
        if: github.ref_type == 'tag'
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $V"
            exit 1
          fi
      - name: Build sdist + wheel
        run: python -m build
      - name: Metadata check
        run: python -m twine check dist/*
      - name: Publish to PyPI (Trusted Publishing + attestations)
        # only a tag PUSH publishes; workflow_dispatch (even on a tag ref)
        # is always a dry-run
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          attestations: true

  post-publish-smoke:
    needs: test-build-publish
    # runs only when the publish step actually ran (tag push, not dispatch)
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install the PUBLISHED artifact in a clean environment
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          for i in $(seq 1 10); do
            python -m pip install "contexel==$V" && break
            echo "index not ready yet (attempt $i), retrying in 30s"; sleep 30
          done
          python -c "import contexel; print('installed', contexel.__version__)"
      - name: Run the quickstart against the published package
        run: |
          cd "$RUNNER_TEMP"   # away from the repo, so the wheel is what's imported
          python - <<'PY'
          from contexel import select, dedupe, rescore, rank, trim_to_budget, trace
          raw = [
              {"title": f"doc {i}", "url": f"https://kb/{i % 4}",
               "snippet": "retry with exponential backoff " * 10, "score": i % 7}
              for i in range(12)
          ]
          with trace() as t:
              r = select(raw, ["title", "url", "snippet"])
              r = dedupe(r, key="url")
              r = rescore(r, query="exponential backoff", fields=("title", "snippet"))
              r = rank(r, by="score", desc=True)
              r = trim_to_budget(r, max_tokens=400)
          assert r and len(r) <= 4, r
          print(t.report())
          print("quickstart OK:", len(r), "records")
          PY
