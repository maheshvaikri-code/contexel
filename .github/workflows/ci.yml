name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # full interpreter matrix on Linux; oldest + newest legs prove
        # Windows and macOS (both packages are pure — OS coverage is about
        # behavior, not builds; the release workflow gates on all three)
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.9" }
          - { os: macos-latest, python-version: "3.13" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  # Cross-language parity (ADR-001): Python is canon. Regenerate the golden
  # vectors, fail if the committed file is stale, then hold the TypeScript
  # package to them byte-for-byte — on every OS we release for.
  ts-parity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python parity/generate_vectors.py
      - run: git diff --exit-code parity/vectors.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
        working-directory: ts
      - run: npm run build
        working-directory: ts
      - run: npm test
        working-directory: ts
