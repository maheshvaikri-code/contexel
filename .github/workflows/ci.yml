name: CI

on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # full interpreter matrix on Linux; oldest + newest legs prove
        # Windows and macOS (both packages are pure — OS coverage is about
        # behavior, not builds; the release workflow gates on all three)
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # 3.9 is pinned to ubuntu-24.04: ubuntu-latest is now 26.04, for
          # which actions/setup-python publishes no 3.9 build
          - { os: ubuntu-24.04, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.9" }
          - { os: macos-latest, python-version: "3.13" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  # Release hygiene (brief AC 32-33), on every push and pull request, not only
  # when a tag is cut: the seven version copies agree, the package is typed and
  # lint-clean, and the wheel really ships py.typed. mypy 2.x needs Python
  # 3.10 or newer, so this runs on 3.12; the test matrix covers 3.9.
  hygiene:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: The seven version locations agree
        run: python tools/check_versions.py
      - run: pip install -e ".[lint]"
      - run: ruff check contexel
      - run: mypy
      - name: The wheel ships py.typed
        run: |
          pip wheel . --no-deps -w dist
          python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'contexel/py.typed' in names, names"

  # Cross-language parity (ADR-001): Python is canon. Regenerate the golden
  # vectors, fail if the committed file is stale, then hold the TypeScript
  # package to them byte-for-byte — on every OS we release for.
  ts-parity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python parity/generate_vectors.py
      - run: git diff --exit-code parity/vectors.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
        working-directory: ts
      - run: npm run build
        working-directory: ts
      - run: npm test
        working-directory: ts

  # Same contract, third language: vectors from canon, then the C# suite.
  cs-parity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python parity/generate_vectors.py
      - run: git diff --exit-code parity/vectors.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test csharp/Contexel.Tests/Contexel.Tests.csproj --nologo
      - run: dotnet pack csharp/Contexel/Contexel.csproj --nologo -o /tmp/nupkg
