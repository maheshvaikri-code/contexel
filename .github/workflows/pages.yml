# Publishes the docs site — designated source: site/ ONLY (docs/ holds
# internal paperwork and is never published). Fail-closed: the link/asset/
# secret check runs before any deploy step. Opt-in recorded in docs/brief.md
# per .Doctrine/skills/web-publishing.md; requires Pages to be enabled with
# "GitHub Actions" as the source in repo settings (a human action).
name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/site_check.py', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify site (fail closed before publish)
        run: python tools/site_check.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true  # creates the Pages site on first run (opt-in: docs/brief.md)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
